name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - policy-check
      - migration-check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build -t jit-access:${{ github.sha }} .

  policy-check:
    name: Policy Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate OPA policies
        run: docker run --rm -v "${{ github.workspace }}/policies:/policies" openpolicyagent/opa:latest check /policies

  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jituser
          POSTGRES_PASSWORD: jitpass
          POSTGRES_DB: jitaccess
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jituser -d jitaccess"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://jituser:jitpass@localhost:5432/jitaccess

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head
